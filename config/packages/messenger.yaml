messenger:
    failure_transport: failed
    transports:
        sync: 'sync://'
        processing:
            dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
            options:
                queue_name: processing
                redeliver_timeout: 3600
            retry_strategy:
                max_retries: 3
                delay: 10000
        failed:
            dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
            options:
                queue_name: failed
    routing:
        App\Message\ProcessItem: processing
when@test:
    messenger:
        transports:
            processing: 'in-memory://'
            failed: 'in-memory://'
