ai:
    # see https://symfony.com/doc/current/ai/components/platform.html
    platform:
        gemini:
            api_key: '%env(GEMINI_API_KEY)%'
        ollama:
            endpoint: '%env(OLLAMA_ENDPOINT)%'
        openai:
            api_key: '%env(OPENAI_API_KEY)%'
        mistral:
            api_key: '%env(MISTRAL_API_KEY)%'
        huggingface:
            # Chat completions through the Hugging Face inference router, billed to the Hugging Face account.
            api_key: '%env(HUGGINGFACE_API_KEY)%'
            model_catalog:
                models:
                    'Qwen/Qwen3.8-27B': { class: 'Symfony\AI\Platform\Bridge\HuggingFace\Completions', capabilities: ['input-messages', 'input-text', 'input-image', 'input-multimodal', 'output-text', 'output-structured', 'output-streaming', 'tool-calling'] }
                    'moonshotai/Kimi-K3.1-Pro': { class: 'Symfony\AI\Platform\Bridge\HuggingFace\Completions', capabilities: ['input-messages', 'input-text', 'input-image', 'input-multimodal', 'output-text', 'output-structured', 'output-streaming', 'tool-calling'] }
                    'google/gemma-4-31B-it': { class: 'Symfony\AI\Platform\Bridge\HuggingFace\Completions', capabilities: ['input-messages', 'input-text', 'input-image', 'input-multimodal', 'output-text', 'output-structured', 'output-streaming', 'tool-calling'] }

    # see https://symfony.com/doc/current/ai/bundles/ai-bundle.html
    agent:
        # The chat page calls the MCP tool methods directly, not through MCP:
        # https://github.com/symfony/ai/issues/2539
        memorial_chat:
            platform: 'ai.platform.huggingface'
            model: '%env(MEMORIAL_CHAT_MODEL)%'
            prompt:
                file: '%kernel.project_dir%/config/prompts/memorial-chat.md'
            tools:
                - service: 'App\Mcp\MemorialTools'
                  name: 'find_memorials'
                  description: 'Find the stones closest in meaning to a question (for example veterans, music, sports, physicians, scripture). Returns each stone with its dense summary and link, nearest first. Use it first for questions about themes.'
                  method: 'find'
                - service: 'App\Mcp\MemorialTools'
                  name: 'search_memorials'
                  description: 'Exact word search in names, carved text and descriptions. Use it for a surname or a specific word, not for themes. Returns record ids, titles and links.'
                  method: 'search'
                - service: 'App\Mcp\MemorialTools'
                  name: 'get_memorial'
                  description: 'Read one memorial record: proposed people with dates, inscriptions, open questions, photos and other photos of the same stone.'
                  method: 'get'
            max_tool_calls: 6
            # The conversation (questions and answers) is kept in Postgres under the id of its MessageBag.
            message_store: 'ai.message_store.doctrine.dbal.memorial_chat'
            # The stones nearest to the question go into the system prompt before the first model call.
            memory:
                service: 'App\Chat\StoneMemory'

    # see https://symfony.com/doc/current/ai/components/store.html
    store:
        postgres:
            # One vector per stone, built from its dense summary by app:vectorize.
            memorials:
                dbal_connection: 'doctrine.dbal.default_connection'
                table_name: 'memorial_vectors_openai'
                metric: 'cosine'
                dimensions: 1536

    message_store:
        doctrine:
            dbal:
                memorial_chat:
                    connection: 'default'
                    table_name: 'chat_messages'

    vectorizer:
        # Hugging Face hf-inference took 4 to 12 seconds per question embedding; OpenAI answers in well under a second.
        openai:
            platform: 'ai.platform.openai'
            model: 'text-embedding-3-small'
